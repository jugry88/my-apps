<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 앱 모음</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 앱 모음">
<meta name="theme-color" content="#f8f8f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2a3a;--sub:#6b6a78;--line:#e7e6e1;--bg:#f8f8f6;--blue:#3789c9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
       padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom))}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
       background:radial-gradient(60vmax 60vmax at -10% -10%,rgba(250,186,11,.16),transparent 60%),
                  radial-gradient(55vmax 55vmax at 110% -5%,rgba(98,198,241,.16),transparent 60%),
                  radial-gradient(50vmax 50vmax at 100% 110%,rgba(84,79,156,.08),transparent 60%)}
  .wrap{max-width:880px;margin:0 auto}
  header{margin-bottom:26px}
  h1{font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:-.02em}
  header p{color:var(--sub);margin-top:6px;font-size:15px}
  .count{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:var(--blue);background:#e8f2fa;border-radius:999px;padding:5px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;
        text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(0,0,0,.04);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
  .card:active{transform:scale(.98)}
  .top{display:flex;align-items:center;gap:12px}
  .icon{width:56px;height:56px;border-radius:14px;flex:none;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .emoji{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;background:#f1f0ec}
  .name{font-size:18px;font-weight:900}
  .tag{font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}
  .desc{color:var(--sub);font-size:14px;line-height:1.6;margin:12px 0 14px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9a99a4}
  .open{font-weight:700;color:var(--blue);font-size:14px}
  .soon{border-style:dashed;background:transparent;box-shadow:none;justify-content:center;align-items:center;min-height:180px;color:#9a99a4;text-align:center;font-weight:700}
  footer{margin-top:30px;text-align:center;color:#b0afb8;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>내 앱 모음</h1>
    <p>직접 만든 앱들을 한곳에 모아 두었어요.</p>
    <span class="count" id="count"></span>
  </header>
  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>
</div>
