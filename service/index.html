<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봉사 보고</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="봉사 보고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f6f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --ink:#24232f; --sub:#6d6c79; --line:#e8e6df;
    --main:#2f7d6d; --main2:#3f9e8a; --soft:#e6f2ee; --warn:#d9822b; --warnsoft:#fbeedd; --sun:#d4483b; --sat:#3a6fb0;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif}
  body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  button{font:inherit;color:inherit;cursor:pointer}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
  header h1{font-size:22px;font-weight:900;letter-spacing:-.02em}
  .iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center}
  .iconbtn:active{background:#ecebe5}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.03)}

  /* month nav */
  .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .mnav .title{font-size:19px;font-weight:900}
  .mnav .title small{display:block;text-align:center;font-size:12px;font-weight:500;color:var(--sub);margin-top:1px}
  .navbtn{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;font-weight:700}
  .navbtn:active{background:#f1f0eb}
  .todaybtn{border:0;background:var(--soft);color:var(--main);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:4px}

  /* summary */
  .sum{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .sum .big{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1}
  .sum .big span{font-size:16px;font-weight:700;color:var(--sub);margin-left:4px}
  .sum .right{text-align:right;font-size:13px;color:var(--sub);line-height:1.5}
  .sum .right b{color:var(--ink)}
  .bar{height:12px;border-radius:99px;background:#eeede7;overflow:hidden;margin:12px 0 8px;position:relative}
  .bar > div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--main2),var(--main));transition:width .4s}
  .bar.done > div{background:linear-gradient(90deg,#e0b13a,#d39221)}
  .note{font-size:13px;color:var(--sub)}
  .note b{color:var(--main)}
  .note.warn b{color:var(--warn)}

  /* calendar */
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow div{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:2px 0 6px}
  .dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
  .day{aspect-ratio:1/1.08;border:1px solid transparent;border-radius:12px;background:#faf9f6;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;position:relative;min-width:0}
  .day:active{transform:scale(.96)}
  .day .n{font-size:13px;font-weight:700;line-height:1}
  .day.sun .n{color:var(--sun)} .day.sat .n{color:var(--sat)}
  .day .h{font-size:12px;font-weight:900;color:#fff;background:var(--main);border-radius:999px;padding:2px 6px;line-height:1.3;max-width:100%}
  .day.has{background:var(--soft);border-color:#cfe5de}
  .day.today{border-color:var(--ink)}
  .day.blank{background:transparent;pointer-events:none}
  .day .memo{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .day.future{opacity:.55}

  /* year */
  .yhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  .yhead h2{font-size:16px;font-weight:900}
  .yhead span{font-size:12px;color:var(--sub)}
  .ybig{font-size:26px;font-weight:900;margin-top:6px}
  .ybig span{font-size:14px;color:var(--sub);font-weight:700;margin-left:4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{background:#faf9f6;border-radius:12px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:clamp(13px,4.2vw,17px);font-weight:900;white-space:nowrap}
  .stat small{white-space:nowrap}
  .stat small{font-size:11px;color:var(--sub)}
  .stat.good b{color:var(--main)} .stat.bad b{color:var(--warn)}
  .months{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .mrow{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:3px 2px;border-radius:8px}
  .mrow:active{background:#f3f2ed}
  .mrow .mname{font-size:13px;font-weight:700;color:var(--sub)}
  .mrow .mbar{height:8px;border-radius:99px;background:#eeede7;overflow:hidden;position:relative}
  .mrow .mbar div{height:100%;background:var(--main2);border-radius:99px}
  .mrow .mbar.full div{background:#d39221}
  .mrow .mval{font-size:13px;font-weight:700;text-align:right}
  .mrow.cur .mname{color:var(--ink)}
  .mrow.fut{opacity:.45}

  .actions{display:flex;gap:8px}
  .btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:15px}
  .btn.main{background:var(--main);color:#fff}
  .btn.light{background:#efeee8}
  .btn.danger{background:#fbe9e7;color:#c0392b}
  .btn:active{transform:scale(.98)}

  /* sheet */
  .dim{position:fixed;inset:0;background:rgba(30,30,40,.4);display:none;z-index:20;align-items:flex-end;justify-content:center}
  .dim.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  @media (min-width:700px){.dim{align-items:center}.sheet{border-radius:24px}}
  .sheet h3{font-size:19px;font-weight:900;margin-bottom:2px}
  .sheet .sub{font-size:13px;color:var(--sub);margin-bottom:14px}
  .stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 12px}
  .stepper button{width:58px;height:58px;border-radius:18px;border:0;background:#efeee8;font-size:28px;font-weight:700}
  .stepper button:active{background:#e3e2db}
  .hv{min-width:150px;text-align:center}
  .hv b{font-size:40px;font-weight:900;letter-spacing:-.02em}
  .hv small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
  .quick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700}
  .quick button.sel{background:var(--main);border-color:var(--main);color:#fff}
  label.lb{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:4px 0 6px}
  textarea{width:100%;min-height:88px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;resize:vertical;background:#fbfaf7;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--main);background:#fff}
  .sheet .actions{margin-top:14px}
  .setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .setrow:last-of-type{border-bottom:0}
  .setrow span{font-size:15px;font-weight:700}
  .setrow small{display:block;font-size:12px;color:var(--sub);font-weight:400}
  .setrow input[type=number]{width:82px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:16px;text-align:right}
  .seg{display:flex;background:#efeee8;border-radius:12px;padding:3px}
  .seg button{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--sub)}
  .seg button.sel{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#24232f;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .tip{font-size:12px;color:var(--sub);text-align:center;line-height:1.6}
  .backup-warn{display:none;background:var(--warnsoft);color:#8a4e12;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5}
  .backup-warn.on{display:block}
  .backup-warn button{border:0;background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-left:6px;color:#8a4e12}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>봉사 보고</h1>
    <div style="display:flex;gap:2px">
      <button class="iconbtn" id="btnReport" title="보고 문구 복사">📋</button>
      <button class="iconbtn" id="btnSettings" title="설정">⚙️</button>
    </div>
  </header>

  <div class="backup-warn" id="backupWarn">기록은 이 기기에만 저장돼요. 가끔 백업해 두세요.<button id="backupNow">지금 백업</button></div>

  <section class="card">
    <div class="mnav">
      <button class="navbtn" id="prev" aria-label="이전 달">‹</button>
      <div class="title" id="mtitle"></div>
      <button class="navbtn" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="sum">
      <div class="big" id="mtotal"></div>
      <div class="right" id="mright"></div>
    </div>
    <div class="bar" id="mbarWrap"><div id="mbar"></div></div>
    <div class="note" id="mnote"></div>
  </section>

  <section class="card">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="card">
    <div class="yhead"><h2 id="ytitle"></h2><span id="yrange"></span></div>
    <div class="ybig" id="ytotal"></div>
    <div class="bar" id="ybarWrap"><div id="ybar"></div></div>
    <div class="stats" id="ystats"></div>
    <div class="months" id="ymonths"></div>
  </section>

  <p class="tip">날짜를 누르면 시간과 메모를 기록할 수 있어요 · 주황 점은 메모가 있는 날<br>기록은 이 기기에 저장돼요 · ⚙️ 설정에서 백업할 수 있어요</p>
</div>

<!-- day sheet -->
<div class="dim" id="dayDim">
  <div class="sheet">
    <h3 id="dTitle"></h3>
    <div class="sub" id="dSub">30분 단위로 기록해요</div>
    <div class="stepper">
      <button id="minus" aria-label="30분 빼기">−</button>
      <div class="hv"><b id="hval">0</b><small id="hmin">0분</small></div>
      <button id="plus" aria-label="30분 더하기">+</button>
    </div>
    <div class="quick" id="quick"></div>
    <label class="lb" for="memo">메모 <span style="font-weight:400">(선택)</span></label>
    <textarea id="memo" placeholder="예) 호별 방문, 재방문 2건, 전시대"></textarea>
    <div class="actions">
      <button class="btn danger" id="dDel">지우기</button>
      <button class="btn light" id="dCancel">취소</button>
      <button class="btn main" id="dSave" style="flex:1.6">저장</button>
    </div>
  </div>
</div>

<!-- settings sheet -->
<div class="dim" id="setDim">
  <div class="sheet">
    <h3>설정</h3>
    <div class="sub">목표와 백업을 관리해요</div>
    <div class="setrow"><span>한 달 목표<small>시간</small></span><input type="number" id="sMonth" min="1" step="1"></div>
    <div class="setrow"><span>1년 목표<small>시간 · 봉사 연도(9월~다음 해 8월)</small></span><input type="number" id="sYear" min="1" step="1"></div>
    <div class="setrow" style="display:block">
      <span>백업<small>기기를 바꾸거나 인터넷 기록을 지우기 전에 꼭 백업하세요</small></span>
      <div class="actions" style="margin-top:10px">
        <button class="btn light" id="bExport">💾 백업 파일 저장</button>
        <button class="btn light" id="bImport">📂 백업 불러오기</button>
      </div>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn danger" id="bReset">전체 기록 지우기</button>
      <button class="btn main" id="sClose" style="flex:1.6">완료</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- storage ---------------- */
const KEY='serviceReport.v1';
const DEF={entries:{},settings:{month:50,year:600},lastBackup:0};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.entries)return {...DEF,...d,settings:{...DEF.settings,...(d.settings||{})}};}catch(e){}return JSON.parse(JSON.stringify(DEF));}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('저장하지 못했어요. 저장 공간을 확인해 주세요.');}}
// ask the browser to keep this data (helps against automatic clean-up)
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------------- helpers ---------------- */
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const today=new Date(); today.setHours(0,0,0,0);
function fmtH(h){ // 2.5 -> "2시간 30분"
  const t=Math.round(h*2)/2, whole=Math.floor(t), half=t-whole>0;
  if(t===0) return '0시간';
  return (whole?whole+'시간':'')+(half?(whole?' ':'')+'30분':'');
}
const num=h=>{const t=Math.round(h*2)/2;return Number.isInteger(t)?String(t):t.toFixed(1);};
function monthTotal(y,m){let s=0;const pre=`${y}-${pad(m+1)}-`;for(const k in DB.entries)if(k.startsWith(pre))s+=DB.entries[k].h||0;return s;}
function yearStart(y,m){ // service year: September 1 to the end of August next year
  return m>=8?[y,8]:[y-1,8];
}
function yearMonths(y,m){const [sy,sm]=yearStart(y,m);const out=[];for(let i=0;i<12;i++){const mm=(sm+i)%12, yy=sy+Math.floor((sm+i)/12);out.push([yy,mm]);}return out;}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200);}

/* ---------------- view state ---------------- */
let vy=today.getFullYear(), vm=today.getMonth();

function render(){
  const S=DB.settings;
  // month header
  document.getElementById('mtitle').innerHTML=`${vy}년 ${vm+1}월`+((vy!==today.getFullYear()||vm!==today.getMonth())?`<small><button class="todaybtn" id="goToday">이번 달로</button></small>`:'');
  const gt=document.getElementById('goToday'); if(gt) gt.onclick=()=>{vy=today.getFullYear();vm=today.getMonth();render();};
  const mt=monthTotal(vy,vm), goal=S.month;
  document.getElementById('mtotal').innerHTML=`${num(mt)}<span>/ ${goal}시간</span>`;
  const left=Math.max(0,goal-mt);
  const isCur=vy===today.getFullYear()&&vm===today.getMonth();
  const dim=new Date(vy,vm+1,0).getDate();
  const daysLeft=isCur?dim-today.getDate()+1:0;
  document.getElementById('mright').innerHTML=left>0?`남은 시간 <b>${fmtH(left)}</b>`+(isCur&&daysLeft>0?`<br>남은 ${daysLeft}일 · 하루 약 <b>${num(Math.ceil(left/daysLeft*2)/2)}시간</b>`:''):`<b>이번 달 목표 달성 🎉</b>`;
  document.getElementById('mbar').style.width=Math.min(100,goal?mt/goal*100:0)+'%';
  document.getElementById('mbarWrap').classList.toggle('done',mt>=goal);
  const days=Object.keys(DB.entries).filter(k=>k.startsWith(`${vy}-${pad(vm+1)}-`)&&DB.entries[k].h>0).length;
  document.getElementById('mnote').innerHTML=mt>goal?`목표보다 <b>${fmtH(mt-goal)}</b> 더 했어요 · 봉사한 날 ${days}일`:`봉사한 날 <b>${days}일</b>`;

  // calendar
  const g=document.getElementById('grid'); const first=new Date(vy,vm,1).getDay();
  let html=''; for(let i=0;i<first;i++) html+='<div class="day blank"></div>';
  for(let d=1;d<=dim;d++){
    const k=key(vy,vm,d), e=DB.entries[k], wd=(first+d-1)%7, dt=new Date(vy,vm,d);
    const cls=['day']; if(wd===0)cls.push('sun'); if(wd===6)cls.push('sat');
    if(e&&e.h>0)cls.push('has'); if(dt.getTime()===today.getTime())cls.push('today'); if(dt>today)cls.push('future');
    html+=`<button class="${cls.join(' ')}" data-k="${k}"><span class="n">${d}</span>${e&&e.h>0?`<span class="h">${num(e.h)}</span>`:''}${e&&e.memo?'<span class="memo" title="메모 있음"></span>':''}</button>`;
  }
  g.innerHTML=html;
  g.querySelectorAll('.day[data-k]').forEach(b=>b.onclick=()=>openDay(b.dataset.k));

  // year
  const ms=yearMonths(vy,vm), [sy,sm]=ms[0], [ey,em]=ms[11];
  document.getElementById('ytitle').textContent=`${sy}~${String(ey).slice(2)} 봉사 연도`;
  document.getElementById('yrange').textContent=`${sy}.${sm+1} ~ ${ey}.${em+1}`;
  let yt=0, passed=0, rows='';
  const curIdx=ms.findIndex(([y,m])=>y===today.getFullYear()&&m===today.getMonth());
  ms.forEach(([y,m],i)=>{
    const t=monthTotal(y,m); yt+=t;
    const fut=new Date(y,m,1)>today, cur=y===today.getFullYear()&&m===today.getMonth();
    if(!fut&&!cur) passed++;
    rows+=`<button class="mrow${cur?' cur':''}${fut?' fut':''}" data-y="${y}" data-m="${m}"><span class="mname">${m+1}월</span><span class="mbar${t>=S.month?' full':''}"><div style="width:${Math.min(100,S.month?t/S.month*100:0)}%"></div></span><span class="mval">${num(t)}시간</span></button>`;
  });
  document.getElementById('ymonths').innerHTML=rows;
  document.querySelectorAll('.mrow').forEach(b=>b.onclick=()=>{vy=+b.dataset.y;vm=+b.dataset.m;render();window.scrollTo({top:0,behavior:'smooth'});});
  document.getElementById('ytotal').innerHTML=`${num(yt)}<span>/ ${S.year}시간</span>`;
  document.getElementById('ybar').style.width=Math.min(100,S.year?yt/S.year*100:0)+'%';
  document.getElementById('ybarWrap').classList.toggle('done',yt>=S.year);
  // pace: months finished in this goal year (current month counts in progress)
  let monthsDone;
  if(curIdx>=0) monthsDone=curIdx; else monthsDone=(new Date(sy,sm,1)>today)?0:12;
  const expected=S.month*monthsDone;
  const diff=yt-expected;
  const remainMonths=curIdx>=0?12-curIdx:(monthsDone===12?0:12);
  const yleft=Math.max(0,S.year-yt);
  const perMonth=remainMonths>0?Math.ceil(yleft/remainMonths*2)/2:0;
  document.getElementById('ystats').innerHTML=
    `<div class="stat"><b>${num(yleft)}시간</b><small>남은 시간</small></div>`+
    `<div class="stat ${diff>=0?'good':'bad'}"><b>${diff>=0?'+':'−'}${num(Math.abs(diff))}시간</b><small>${monthsDone?`${monthsDone}개월 목표 대비`:'아직 시작 전'}</small></div>`+
    `<div class="stat"><b>${yleft===0?'완료 🎉':num(perMonth)+'시간'}</b><small>${remainMonths?`남은 달 매달`:'기간 종료'}</small></div>`;

  // backup reminder: has records and no backup for 30 days
  const has=Object.keys(DB.entries).length>0;
  document.getElementById('backupWarn').classList.toggle('on',has&&(Date.now()-(DB.lastBackup||0))>30*864e5);
}

/* ---------------- day sheet ---------------- */
let curKey=null, curH=0;
const quickVals=[0.5,1,1.5,2,2.5,3,4,5];
function setH(h){curH=Math.max(0,Math.min(24,Math.round(h*2)/2));document.getElementById('hval').textContent=num(curH);document.getElementById('hmin').textContent=fmtH(curH);
  document.querySelectorAll('#quick button').forEach(b=>b.classList.toggle('sel',+b.dataset.v===curH));}
document.getElementById('quick').innerHTML=quickVals.map(v=>`<button data-v="${v}">${num(v)}시간</button>`).join('');
document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>setH(+b.dataset.v));
function openDay(k){
  curKey=k; const [y,m,d]=k.split('-').map(Number); const wd='일월화수목금토'[new Date(y,m-1,d).getDay()];
  document.getElementById('dTitle').textContent=`${m}월 ${d}일 (${wd})`;
  const e=DB.entries[k]||{h:0,memo:''};
  setH(e.h||0); document.getElementById('memo').value=e.memo||'';
  document.getElementById('dDel').style.display=DB.entries[k]?'':'none';
  document.getElementById('dayDim').classList.add('on');
}
function closeDay(){document.getElementById('dayDim').classList.remove('on');curKey=null;}
document.getElementById('minus').onclick=()=>setH(curH-0.5);
document.getElementById('plus').onclick=()=>setH(curH+0.5);
document.getElementById('dCancel').onclick=closeDay;
document.getElementById('dSave').onclick=()=>{
  const memo=document.getElementById('memo').value.trim();
  if(curH===0&&!memo) delete DB.entries[curKey]; else DB.entries[curKey]={h:curH,memo};
  save(); closeDay(); render(); toast('저장했어요');
};
document.getElementById('dDel').onclick=()=>{delete DB.entries[curKey];save();closeDay();render();toast('지웠어요');};
document.getElementById('dayDim').onclick=e=>{if(e.target.id==='dayDim')closeDay();};

/* ---------------- month nav ---------------- */
document.getElementById('prev').onclick=()=>{vm--;if(vm<0){vm=11;vy--;}render();};
document.getElementById('next').onclick=()=>{vm++;if(vm>11){vm=0;vy++;}render();};
// swipe left/right on the calendar to change month
(function(){let x0=null;const g=document.getElementById('grid');
  g.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  g.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60){(dx<0?document.getElementById('next'):document.getElementById('prev')).click();}x0=null;});})();

/* ---------------- report copy ---------------- */
document.getElementById('btnReport').onclick=async()=>{
  const t=monthTotal(vy,vm);
  const txt=`${vy}년 ${vm+1}월 봉사 보고\n시간: ${num(t)}시간`;
  try{await navigator.clipboard.writeText(txt);toast(`복사했어요: ${vm+1}월 ${num(t)}시간`);}
  catch(e){prompt('아래 문구를 복사하세요',txt);}
};

/* ---------------- settings ---------------- */
function openSet(){const S=DB.settings;document.getElementById('sMonth').value=S.month;document.getElementById('sYear').value=S.year;
  document.getElementById('setDim').classList.add('on');}
function closeSet(){
  const mo=parseFloat(document.getElementById('sMonth').value), yr=parseFloat(document.getElementById('sYear').value);
  if(mo>0) DB.settings.month=mo; if(yr>0) DB.settings.year=yr;
  save(); document.getElementById('setDim').classList.remove('on'); render();
}
document.getElementById('btnSettings').onclick=openSet;
document.getElementById('sClose').onclick=closeSet;
document.getElementById('setDim').onclick=e=>{if(e.target.id==='setDim')closeSet();};

async function exportData(){
  const name=`봉사보고_백업_${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}.json`;
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPad|iPhone|iPod|Android/i.test(navigator.userAgent)){await navigator.share({files:[file]});}
    else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
    DB.lastBackup=Date.now();save();render();toast('백업 파일을 만들었어요');
  }catch(e){if(e&&e.name!=='AbortError')toast('백업하지 못했어요');}
}
document.getElementById('bExport').onclick=exportData;
document.getElementById('backupNow').onclick=exportData;
document.getElementById('bImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||typeof d.entries!=='object')throw 0;
    const n=Object.keys(d.entries).length;
    if(!confirm(`백업에 있는 ${n}일치 기록으로 바꿀까요?\n지금 이 기기의 기록은 백업 내용으로 바뀌어요.`))return;
    DB={...DEF,...d,settings:{...DEF.settings,...(d.settings||{})}};save();render();toast('백업을 불러왔어요');
  }catch(err){toast('백업 파일을 읽지 못했어요');}
  e.target.value='';
};
document.getElementById('bReset').onclick=()=>{
  if(!confirm('모든 봉사 기록을 지울까요?\n되돌릴 수 없어요. 먼저 백업을 권해요.'))return;
  DB.entries={};save();render();toast('모든 기록을 지웠어요');
};

/* ---------------- offline support ---------------- */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}

render();
</script>
</body>
</html>
